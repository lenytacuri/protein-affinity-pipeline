    commands:
      - python /workspace/scripts/pipeline_stage.py finish
    retry:
      type: constant
      interval: PT30S
      maxAttempts: 2
errors:
  - id: report_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Pipeline detenido. Revisar la tarea fallida y reports/pipeline/{{ execution.id }}. No ejecutar etapas posteriores manualmente."
