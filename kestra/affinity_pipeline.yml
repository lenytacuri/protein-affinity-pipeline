id: affinity_pipeline
namespace: protein.affinity
description: Lote curado bajo demanda, desde RCSB hasta OBT validada. Sin AlphaFold ni cron.
inputs:
  - id: mode
    type: SELECT
    values: [reference, curated, replay]
    defaults: reference
  - id: input_path
    type: STRING
    defaults: ""
  - id: refresh
    type: BOOL
    defaults: false
concurrency:
  limit: 1
  behavior: QUEUE
tasks:
  - id: prepare
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: protein-affinity-pset2-runner:local
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      volumes:
        - "{{ envs.project_dir }}:/workspace"
    env:
      PIPELINE_EXECUTION_ID: "{{ execution.id }}"
      PIPELINE_MODE: "{{ inputs.mode }}"
      PIPELINE_INPUT: "{{ inputs.input_path }}"
      RCSB_REFRESH: "{{ inputs.refresh }}"
    commands:
      - python /workspace/scripts/pipeline_stage.py prepare
    retry:
      type: constant
      interval: PT30S
      maxAttempts: 2
  - id: extract
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: protein-affinity-pset2-runner:local
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      volumes:
        - "{{ envs.project_dir }}:/workspace"
    env:
      PIPELINE_EXECUTION_ID: "{{ execution.id }}"
    commands:
      - python /workspace/scripts/pipeline_stage.py extract
    retry:
      type: constant
      interval: PT30S
      maxAttempts: 2
  - id: raw
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: protein-affinity-pset2-runner:local
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      volumes:
        - "{{ envs.project_dir }}:/workspace"
    env:
