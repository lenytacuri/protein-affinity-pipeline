id: build_gold
namespace: protein.affinity
description: Modelo estrella Gold con dbt; conserva observaciones y valida las uniones para Spark.
concurrency:
  limit: 1
  behavior: QUEUE
tasks:
  - id: build
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: protein-affinity-pset2-geometry:local
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      volumes:
        - "{{ envs.project_dir }}:/workspace"
    commands:
      - python /workspace/scripts/build_gold.py
    retry:
      type: constant
      interval: PT30S
      maxAttempts: 2
